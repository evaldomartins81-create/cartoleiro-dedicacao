name: Diagnostico da API do Cartola
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cartola-diagnostic.yml'
permissions:
  contents: read
jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar fontes oficiais e validar JSON
        run: |
          python3 - <<'PY'
          import json,urllib.request
          urls=[
            "https://api.cartola.globo.com/mercado/status",
            "https://api.cartola.globo.com/atletas/mercado",
            "https://api.cartolafc.globo.com/atletas/mercado",
          ]
          worked=False
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 CartoleiroDedicacao/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=18) as r:
                data=json.load(r)
                print(url, "OK",r.status, "keys",list(data)[:8],"athletes",len(data.get("atletas",[])))
                if "atletas" in data and len(data["atletas"])>100:worked=True
            except Exception as e:
              print(url,"ERROR",type(e).__name__,str(e)[:200])
          if not worked:raise SystemExit("Nenhum mercado real disponivel via GitHub Actions")
          PY
